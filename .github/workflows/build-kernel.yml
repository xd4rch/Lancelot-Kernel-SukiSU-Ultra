name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        options:
          - lancelot
          - merlin

jobs:
  build:
    name: Build SukiSU Ultra + KPM
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.select_device }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "config-suki.env" ]]; then
            grep -v -E "^#|^[[:space:]]*$" "config-suki.env" | sed 's/ #.*//; s/#.*//' >> "$GITHUB_ENV"
          else
            echo "config-suki.env bulunamadı!"; exit 1
          fi

      - name: Setup build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_TIME=$(date '+%Y%m%d%H%M')" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git git-lfs libelf-dev libssl-dev \
            lzop zip python3 python-is-python3 tar xz-utils libncurses5-dev
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          wget -nv --timeout=120 -O clang.tar.gz "${{ env.CLANG_SOURCE }}"
          mkdir -p clang
          tar -C clang/ -zxvf clang.tar.gz --strip-components=1
          rm clang.tar.gz
          rm -f clang/bin/ld

      - name: Download LineageOS 20 Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1

      - name: Apply KernelSU 4.14 Manual Hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          if [[ -f "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" ]]; then
            git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || {
              patch -p1 < "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || true
            }
            echo "[OK] KSU_HOOKS_PATCH.patch uygulandı."
          fi

      - name: Setup SukiSU Source & Core Headers
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          curl -LSs "${{ env.KERNELSU_SETUP_SOURCE }}" | bash -s "${{ env.KERNELSU_TAG }}" || true

          if [ -d "KernelSU/kernel" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sfn ../KernelSU/kernel drivers/kernelsu
          fi

          # Kconfig bağımlılık engellerini temizle
          find drivers/kernelsu/ KernelSU/ -name "Kconfig*" -exec sed -i -E 's/^[[:space:]]*depends on.*/# &/' {} + || true

          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/KernelSU\/Kconfig/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # 1. include/linux/compiler.h fallthrough
          grep -q "fallthrough" include/linux/compiler.h 2>/dev/null || printf '\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif\n' >> include/linux/compiler.h

          # 2. include/linux/task_work.h TWA_RESUME
          grep -q "TWA_RESUME" include/linux/task_work.h 2>/dev/null || printf '\n#ifndef TWA_RESUME\n#define TWA_NONE 0\n#define TWA_RESUME 1\n#define TWA_SIGNAL 2\n#endif\n' >> include/linux/task_work.h

          # 3. include/linux/uaccess.h copy_from_user_nofault
          if [ -f include/linux/uaccess.h ]; then
            grep -q "copy_from_user_nofault" include/linux/uaccess.h || printf '\n#ifndef copy_from_user_nofault\n#define copy_from_user_nofault(dst, src, size) copy_from_user(dst, (const void __user *)(src), size)\n#define copy_to_user_nofault(dst, src, size) copy_to_user((void __user *)(dst), src, size)\n#define strncpy_from_user_nofault(dst, src, size) strncpy_from_user(dst, (const char __user *)(src), size)\n#endif\n' >> include/linux/uaccess.h
          fi

          # 4. arch/arm64/include/asm/uaccess.h access_ok desteği
          if [ -f arch/arm64/include/asm/uaccess.h ]; then
            sed -i -E 's|^[[:space:]]*#define[[:space:]]+access_ok\(type,.*|#define _ACCESS_OK_2(addr, size) __range_ok((unsigned long)(addr), (unsigned long)(size))\n#define _ACCESS_OK_3(type, addr, size) __range_ok((unsigned long)(addr), (unsigned long)(size))\n#define _ACCESS_OK_OVERLOAD(_1, _2, _3, NAME, ...) NAME\n#define access_ok(...) _ACCESS_OK_OVERLOAD(__VA_ARGS__, _ACCESS_OK_3, _ACCESS_OK_2)(__VA_ARGS__)|' arch/arm64/include/asm/uaccess.h
            echo "[OK] arch/arm64/include/asm/uaccess.h access_ok makrosu güncellendi."
          fi

          # 5. Eksik başlık dosyaları
          mkdir -p include/linux include/uapi/linux include/vdso
          [ -f include/linux/set_memory.h ] || printf '#ifndef _LINUX_SET_MEMORY_H\n#define _LINUX_SET_MEMORY_H\n#include <asm/set_memory.h>\n#endif\n' > include/linux/set_memory.h
          [ -f include/linux/pgtable.h ] || printf '#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif\n' > include/linux/pgtable.h
          [ -f include/uapi/linux/mount.h ] || printf '#ifndef _UAPI_LINUX_MOUNT_H\n#define _UAPI_LINUX_MOUNT_H\n#include <linux/mount.h>\n#include <uapi/linux/fs.h>\n#endif\n' > include/uapi/linux/mount.h
          [ -f include/linux/minmax.h ] || printf '#ifndef _LINUX_MINMAX_H\n#define _LINUX_MINMAX_H\n#include <linux/kernel.h>\n#endif\n' > include/linux/minmax.h
          [ -f include/vdso/datapage.h ] || printf '#ifndef _VDSO_DATAPAGE_H\n#define _VDSO_DATAPAGE_H\n#endif\n' > include/vdso/datapage.h

      - name: Apply SukiSU 4.14 Native Sucompat, Protocol Bridge & Manager Bypass
        shell: python
        run: |
          import os, re

          kernel_dir = os.path.join(os.environ['GITHUB_WORKSPACE'], 'kernel_workspace/android-kernel')
          os.chdir(kernel_dir)

          fn_t = (
              "#ifndef _SUKISU_SYSCALL_FN_T_\n#define _SUKISU_SYSCALL_FN_T_\n"
              "#include <linux/compiler.h>\n#include <linux/types.h>\nstruct pt_regs;\n"
              "typedef long (*syscall_fn_t)(const struct pt_regs *);\n#endif\n\n"
          )

          fw_h = (
              "#ifndef _SUKISU_FILE_WRAPPER_4_14_\n#define _SUKISU_FILE_WRAPPER_4_14_\n"
              "#include <linux/version.h>\n#include <linux/fs.h>\n#include <linux/file.h>\n"
              "#include <linux/dcache.h>\n#include <linux/mount.h>\n#include <linux/security.h>\n"
              "#include <linux/err.h>\n"
              "typedef unsigned int __poll_t;\n#define REMAP_FILE_DEDUP 0\n"
              "static inline int security_inode_init_security_anon(struct inode *i, const struct qstr *n, const struct inode *c) { return 0; }\n"
              "#define selinux_inode(i) ((struct inode_security_struct *)(i)->i_security)\n"
              "static inline struct file *alloc_file_pseudo(struct inode *i, struct vfsmount *m, const char *n, int f, const struct file_operations *fops) {\n"
              "    struct qstr s = QSTR_INIT(n, strlen(n)); struct path p = { .dentry = d_alloc_pseudo(m->mnt_sb, &s), .mnt = mntget(m) };\n"
              "    if (!p.dentry) { iput(i); return ERR_PTR(-ENOMEM); }\n"
              "    d_instantiate(p.dentry, i); return alloc_file(&p, (fmode_t)f, fops);\n"
              "}\n#endif\n\n"
          )

          sched_b = "#include <linux/sched.h>\n#include <linux/sched/task.h>\n#include <linux/sched/signal.h>\n#include <linux/init_task.h>\nextern rwlock_t tasklist_lock;\nextern struct task_struct init_task;\n\n"
          pm_h = "#include <linux/uaccess.h>\n#include <asm/cacheflush.h>\n#include <asm/pgtable.h>\n#ifndef __pte_to_phys\n#define __pte_to_phys(pte) ((phys_addr_t)pte_pfn(pte) << PAGE_SHIFT)\n#endif\n#ifndef copy_to_kernel_nofault\n#define copy_to_kernel_nofault probe_kernel_write\n#endif\n\n"

          sel_head = (
              "#ifndef _SUKISU_SEL_HEAD_\n"
              "#define _SUKISU_SEL_HEAD_\n"
              "struct task_security_struct;\n"
              "struct inode_security_struct;\n"
              "struct file_security_struct;\n"
              "#ifndef selinux_cred\n"
              "#define selinux_cred(c) ((struct task_security_struct *)(c)->security)\n"
              "#endif\n"
              "#ifndef selinux_inode\n"
              "#define selinux_inode(i) ((struct inode_security_struct *)(i)->i_security)\n"
              "#endif\n"
              "#endif /* _SUKISU_SEL_HEAD_ */\n\n"
          )

          stub_map = {
              "lsm_hook.c": "int ksu_lsm_hook_init(void){return 0;}\nvoid ksu_lsm_hook_exit(void){}\n",
              "syscall_hook.c": "void *ksu_syscall_table[512] = { 0 };\nint ksu_syscall_hook_init(void) { return 0; }\nvoid ksu_syscall_hook_exit(void) {}\nvoid ksu_stop_ksud_execve_hook(void) {}\nint ksu_syscall_table_hook(int nr, void *hook_fn, void **orig_fn) { return 0; }\nint ksu_syscall_table_unhook(int nr) { return 0; }\n",
              "syscall_hook_manager.c": "int ksu_syscall_hook_manager_init(void){return 0;}\nvoid ksu_syscall_hook_manager_exit(void){}\n",
              "syscall_event_bridge.c": "int ksu_syscall_event_bridge_init(void){return 0;}\nvoid ksu_syscall_event_bridge_exit(void){}\n",
              "setuid_hook.c": "int ksu_setuid_hook_init(void){return 0;}\nvoid ksu_setuid_hook_exit(void){}\n",
              "pkg_observer.c": "int ksu_observer_init(void){return 0;}\nvoid ksu_observer_exit(void){}\nint ksu_pkg_observer_init(void){return 0;}\nvoid ksu_pkg_observer_exit(void){}\n",
              "rules.c": "int apply_kernelsu_rules(void){return 0;}\nint ksu_load_rules(void){return 0;}\n",
              "sepolicy.c": "struct selinux_policy;\nstruct selinux_policy *ksu_dup_sepolicy(struct selinux_policy *o){return (void*)0;}\nint handle_sepolicy(unsigned long arg){return 0;}\n",
              "selinux_hide.c": "int ksu_selinux_hide_init(void){return 0;}\nvoid ksu_selinux_hide_exit(void){}\nbool ksu_is_selinux_hide_enabled(void){return false;}\nint ksu_set_selinux_hide(bool e){return 0;}\nint ksu_get_selinux_hide(void){return 0;}\nvoid ksu_selinux_hide_handle_post_fs_data(void){}\nvoid ksu_selinux_hide_drop_backup_if_unused(void){}\nvoid ksu_selinux_hide_handle_second_stage(void){}\n",
              "cpu_spoof.c": "int ksu_cpu_spoof_init(void){return 0;}\nvoid ksu_cpu_spoof_exit(void){}\nbool ksu_is_cpu_spoof_enabled(void){return false;}\nint ksu_set_cpu_spoof(bool e){return 0;}\nint ksu_get_cpu_spoof(void){return 0;}\nvoid ksu_set_spoof_cpu(bool e){}\n",
              "su_mount_ns.c": "int ksu_su_mount_ns_init(void){return 0;}\nvoid ksu_su_mount_ns_exit(void){}\nint setup_mount_ns(void){return 0;}\n"
          }

          visited_files = set()

          for kdir in ["drivers/kernelsu", "KernelSU"]:
              if not os.path.exists(kdir):
                  continue
              for root, dirs, files in os.walk(kdir, followlinks=True):
                  for file in files:
                      if not (file.endswith(".c") or file.endswith(".h")):
                          continue
                      filepath = os.path.join(root, file)
                      real_p = os.path.realpath(filepath)
                      if real_p in visited_files:
                          continue
                      visited_files.add(real_p)

                      if file in stub_map:
                          with open(real_p, "w", encoding="utf-8") as f:
                              f.write("#include <linux/types.h>\n#include <linux/stddef.h>\n\n" + stub_map[file])
                          print(f"[OK] Stub uygulandı: {real_p}")
                          continue

                      try:
                          with open(real_p, "r", encoding="utf-8", errors="ignore") as f:
                              c = f.read()
                      except Exception:
                          continue

                      orig_c = c

                      if file == "kpm.c":
                          kpm_uacc = (
                              "#include <linux/uaccess.h>\n"
                              "#include <asm/uaccess.h>\n"
                              "#undef access_ok\n"
                              "#define _ACCESS_OK_2(addr, size) __range_ok((unsigned long)(addr), (unsigned long)(size))\n"
                              "#define _ACCESS_OK_3(type, addr, size) __range_ok((unsigned long)(addr), (unsigned long)(size))\n"
                              "#define _ACCESS_OK_OVERLOAD(_1, _2, _3, NAME, ...) NAME\n"
                              "#define access_ok(...) _ACCESS_OK_OVERLOAD(__VA_ARGS__, _ACCESS_OK_3, _ACCESS_OK_2)(__VA_ARGS__)\n\n"
                          )
                          c = kpm_uacc + c
                          print(f"[OK] kpm.c access_ok desteği eklendi: {real_p}")

                      if file in ["syscall_hook.h", "syscall.h"] and "_SUKISU_SYSCALL_FN_T_" not in c:
                          c = fn_t + c

                      if file == "init.c" and ("MODULE_IMPORT_NS" not in c or "#define MODULE_IMPORT_NS" not in c):
                          c = "#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif\n\n" + c

                      if file == "patch_memory.c":
                          c = c.replace("__flush_icache_range", "flush_icache_range").replace("copy_to_kernel_nofault", "probe_kernel_write")
                          if "#ifndef copy_to_kernel_nofault" not in c:
                              c = pm_h + c

                      if file == "file_wrapper.c" and "_SUKISU_FILE_WRAPPER_4_14_" not in c:
                          lines = c.splitlines(keepends=True)
                          out, skip = [], False
                          for l in lines:
                              if any(x in l for x in ["->ops.iopoll", "->ops.mmap_supported_flags", "->ops.remap_file_range", "->ops.fadvise"]): out.append("// " + l)
                              elif any(x in l for x in ["ksu_wrapper_iopoll(", "ksu_wrapper_remap_file_range(", "ksu_wrapper_fadvise("]): skip = True
                              elif skip:
                                  if l.startswith("}"): skip = False
                              else: out.append(l)
                          c = fw_h + "".join(out)

                      if file.startswith("event_queue") and "_SUKISU_EQ_FIX_" not in c:
                          c = "#ifndef _SUKISU_EQ_FIX_\n#define _SUKISU_EQ_FIX_\n#include <linux/poll.h>\n#include <uapi/linux/eventpoll.h>\ntypedef unsigned int __poll_t;\n#ifndef EPOLLIN\n#define EPOLLIN 0x00000001\n#endif\n#ifndef EPOLLHUP\n#define EPOLLHUP 0x00000010\n#endif\n#ifndef EPOLLRDNORM\n#define EPOLLRDNORM 0x00000040\n#endif\n#endif\n\n" + c

                      if file.startswith("seccomp_cache") and "SECCOMP_ARCH_NATIVE_NR" not in c:
                          c = "#include <asm/unistd.h>\n#ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR __NR_syscalls\n#endif\n" + c

                      if "copy_from_user_nofault" in c or "copy_to_user_nofault" in c or "strncpy_from_user_nofault" in c:
                          c = c.replace("copy_from_user_nofault", "copy_from_user").replace("copy_to_user_nofault", "copy_to_user").replace("strncpy_from_user_nofault", "strncpy_from_user")
                      if "<linux/minmax.h>" in c:
                          c = c.replace("<linux/minmax.h>", "<linux/kernel.h>")
                      if "filter_count" in c:
                          c = re.sub(r'.*filter_count.*', '// [4.14 seccomp]', c)
                      if "ksys_close" in c:
                          c = "#include <linux/syscalls.h>\n" + c.replace("ksys_close", "sys_close")
                      if any(k in c for k in ["strncpy_from_user", "copy_from_user", "copy_to_user"]) and "<linux/uaccess.h>" not in c:
                          c = "#include <linux/uaccess.h>\n" + c
                      if "put_task_struct" in c and "<linux/sched/task.h>" not in c:
                          c = "#include <linux/sched/task.h>\n" + c
                      if ("tasklist_lock" in c or "init_task" in c) and "extern rwlock_t tasklist_lock" not in c:
                          c = sched_b + c

                      if file == "selinux.c":
                          if "_SUKISU_SEL_HEAD_" not in c:
                              c = sel_head + c

                          c = c.replace('"u:r:ksu:s0"', '"u:r:su:s0"')

                          c = re.sub(
                              r'error\s*=\s*security_secctx_to_secid\s*\(\s*domain\s*,\s*strlen\s*\(\s*domain\s*\)\s*,\s*&sid\s*\);',
                              'if (domain && (!strcmp(domain, "u:r:ksu:s0") || !strcmp(domain, "u:r:su:s0"))) domain = "u:r:su:s0";\n'
                              '    error = security_secctx_to_secid(domain, strlen(domain), &sid);\n'
                              '    if (error) {\n'
                              '        if (!security_secctx_to_secid("u:r:su:s0", 10, &sid)) error = 0;\n'
                              '        else if (!security_secctx_to_secid("u:r:kernel:s0", 14, &sid)) error = 0;\n'
                              '    }',
                              c
                          )
                          c = re.sub(
                              r'pr_err\([^)]*transive domain failed[^)]*\);\s*return\s+[^;]+;',
                              'pr_warn("KernelSU: domain fallback succeeded\\n"); error = 0;',
                              c
                          )
                          print(f"[OK] selinux.c doğrudan güncellendi: {real_p}")

                      # dispatch.c hook_type stringini 'Manual' yap ve 4.14 kvcalloc uyumluluğunu sağla
                      if file == "dispatch.c":
                          c = c.replace('const char *type = "Unknown";', 'const char *type = "Manual";')
                          c = c.replace('char *type = "Unknown";', 'char *type = "Manual";')
                          c = c.replace('const char *type = "None";', 'const char *type = "Manual";')
                          c = c.replace('char *type = "None";', 'char *type = "Manual";')
                          if "kvcalloc" in c and "#define kvcalloc" not in c:
                              kvcalloc_def = (
                                  "#include <linux/mm.h>\n"
                                  "#include <linux/slab.h>\n"
                                  "#ifndef kvcalloc\n"
                                  "#define kvcalloc(n, elem_size, flags) kvmalloc_array(n, elem_size, (flags) | __GFP_ZERO)\n"
                                  "#endif\n\n"
                              )
                              c = kvcalloc_def + c
                          print(f"[OK] dispatch.c güncellendi: {real_p}")

                      if c != orig_c:
                          with open(real_p, "w", encoding="utf-8") as f:
                              f.write(c)

          # Kbuild alt dizin bayrakları (tüm alt klasörlere yayılması için subdir-ccflags-y)
          for mfile in ["drivers/kernelsu/Makefile", "KernelSU/kernel/Makefile"]:
              if os.path.exists(mfile):
                  with open(mfile, "r") as f: mc = f.read()
                  if "subdir-ccflags-y" not in mc:
                      with open(mfile, "a") as f:
                          f.write("\nsubdir-ccflags-y += -DCONFIG_KSU_MANUAL_HOOK=1 -DCONFIG_KSU_SUCOMPAT=1\n")
                          f.write("ccflags-y += -DCONFIG_KSU_MANUAL_HOOK=1 -DCONFIG_KSU_SUCOMPAT=1\n")
                      print(f"[OK] subdir-ccflags-y eklendi: {mfile}")

          # perm.c sembol tablosu
          perm_code = (
              "#include <linux/fs.h>\n"
              "#include <linux/cred.h>\n"
              "#include <linux/types.h>\n\n"
              "extern unsigned int ksu_manager_appid;\n\n"
              "bool ksu_is_manager(void) {\n"
              "    uid_t uid = current_uid().val;\n"
              "    if (uid == 0 || uid == 2000) return true;\n"
              "    if (ksu_manager_appid != 0 && (uid % 100000) == ksu_manager_appid) return true;\n"
              "    return false;\n"
              "}\n\n"
              "bool always_allow(struct file *filp, unsigned int cmd) {\n"
              "    return true;\n"
              "}\n\n"
              "bool only_root(struct file *filp, unsigned int cmd) {\n"
              "    return current_uid().val == 0 || current_uid().val == 2000;\n"
              "}\n\n"
              "bool only_manager(struct file *filp, unsigned int cmd) {\n"
              "    return ksu_is_manager();\n"
              "}\n\n"
              "bool manager_or_root(struct file *filp, unsigned int cmd) {\n"
              "    return current_uid().val == 0 || current_uid().val == 2000 || ksu_is_manager();\n"
              "}\n\n"
              "bool allowed_for_su(struct file *filp, unsigned int cmd) {\n"
              "    return current_uid().val == 0 || current_uid().val == 2000 || ksu_is_manager();\n"
              "}\n\n"
              "bool ksu_supercall_check_perm(struct file *filp, unsigned int cmd) {\n"
              "    return manager_or_root(filp, cmd);\n"
              "}\n"
          )
          perm_done = set()
          for kdir in ["drivers/kernelsu", "KernelSU"]:
              if not os.path.exists(kdir): continue
              for root, dirs, files in os.walk(kdir, followlinks=True):
                  if "perm.c" in files:
                      rp = os.path.realpath(os.path.join(root, "perm.c"))
                      if rp not in perm_done:
                          with open(rp, "w") as f: f.write(perm_code)
                          perm_done.add(rp)
                          print(f"[OK] perm.c sembol tablosu kuruldu: {rp}")

          # kernel/seccomp.c SukiSU seccomp baypası
          seccomp_c = "kernel/seccomp.c"
          if os.path.exists(seccomp_c):
              with open(seccomp_c, "r") as f: sc = f.read()
              if "ksu_seccomp_supercall_bypass" not in sc:
                  top_includes = "#include <linux/cred.h>\n#include <asm/ptrace.h>\n"
                  hook_sec = (
                      "\n#if defined(CONFIG_KSU)\n"
                      "    /* [ksu_seccomp_supercall_bypass] */\n"
                      "    extern unsigned int ksu_manager_appid;\n"
                      "    if (current_uid().val == 0 || current_uid().val == 2000 || (ksu_manager_appid != 0 && (current_uid().val % 100000) == ksu_manager_appid)) {\n"
                      "        return 0;\n"
                      "    }\n"
                      "    {\n"
                      "        struct pt_regs *regs = task_pt_regs(current);\n"
                      "        if (regs && (unsigned int)regs->regs[0] == 0xdeadbeef) {\n"
                      "            return 0;\n"
                      "        }\n"
                      "    }\n"
                      "#endif\n"
                  )
                  pos = sc.find("__secure_computing(")
                  if pos != -1:
                      b_pos = sc.find("{", pos)
                      if b_pos != -1:
                          sc = top_includes + sc[:b_pos+1] + hook_sec + sc[b_pos+1:]
                          with open(seccomp_c, "w") as f: f.write(sc)
                          print("[OK] kernel/seccomp.c kancası yerleştirildi!")

          # security/selinux/avc.c genel AVC muafiyeti
          avc_c = "security/selinux/avc.c"
          if os.path.exists(avc_c):
              with open(avc_c, "r") as f: ac = f.read()
              if "ksu_avc_manager_bypass" not in ac:
                  avc_bypass = (
                      "\n#if defined(CONFIG_KSU)\n"
                      "    /* [ksu_avc_manager_bypass] */\n"
                      "    extern unsigned int ksu_manager_appid;\n"
                      "    if (current_uid().val == 0 || current_uid().val == 2000 || (ksu_manager_appid != 0 && (current_uid().val % 100000) == ksu_manager_appid)) {\n"
                      "        return 0;\n"
                      "    }\n"
                      "#endif\n"
                  )
                  p = ac.find("avc_has_perm_noaudit(")
                  if p != -1:
                      b = ac.find("{", p)
                      if b != -1:
                          ac = "#include <linux/cred.h>\n" + ac[:b+1] + avc_bypass + ac[b+1:]
                          with open(avc_c, "w") as f: f.write(ac)
                          print("[OK] security/selinux/avc.c muafiyeti uygulandı!")

          # app_profile seccomp stub
          app_done = set()
          for kdir in ["drivers/kernelsu", "KernelSU"]:
              if not os.path.exists(kdir): continue
              for root, dirs, files in os.walk(kdir, followlinks=True):
                  if "app_profile.c" in files:
                      rp = os.path.realpath(os.path.join(root, "app_profile.c"))
                      if rp not in app_done:
                          with open(rp, "r") as f: ap_c = f.read()
                          if "void seccomp_filter_release(struct task_struct *tsk) {}" not in ap_c:
                              with open(rp, "a") as f: f.write("\nvoid seccomp_filter_release(struct task_struct *tsk) {}\n")
                          app_done.add(rp)

          # feature.c ve feature.h içerisindeki kısıtlamaları kaldırma
          for kdir in ["drivers/kernelsu", "KernelSU"]:
              if not os.path.exists(kdir): continue
              for root, dirs, files in os.walk(kdir, followlinks=True):
                  for file in files:
                      if file in ["feature.c", "feature.h", "kernel_umount.c"]:
                          fp = os.path.realpath(os.path.join(root, file))
                          with open(fp, "r", encoding="utf-8", errors="ignore") as f:
                              fc = f.read()
                          orig_fc = fc
                          fc = fc.replace("CONFIG_KSU_MANUAL_HOOK", "_DISABLED_MANUAL_HOOK_CHECK_")
                          fc = re.sub(r'bool\s+su_compat_is_supported\s*\([^)]*\)\s*\{[^}]*\}', 'bool su_compat_is_supported(void) { return true; }', fc)
                          fc = re.sub(r'bool\s+ksu_su_compat_is_supported\s*\([^)]*\)\s*\{[^}]*\}', 'bool ksu_su_compat_is_supported(void) { return true; }', fc)
                          fc = re.sub(r'bool\s+ksu_is_su_compat_supported\s*\([^)]*\)\s*\{[^}]*\}', 'bool ksu_is_su_compat_supported(void) { return true; }', fc)
                          if fc != orig_fc:
                              with open(fp, "w", encoding="utf-8") as f:
                                  f.write(fc)
                              print(f"[OK] feature desteği açıldı: {fp}")

          # 4.14 Native Sucompat Motoru
          full_sucompat_engine = (
              "#include <linux/types.h>\n"
              "#include <linux/fs.h>\n"
              "#include <linux/file.h>\n"
              "#include <linux/binfmts.h>\n"
              "#include <linux/sched.h>\n"
              "#include <linux/uaccess.h>\n"
              "#include <linux/string.h>\n"
              "#include <linux/cred.h>\n"
              "#include <linux/capability.h>\n"
              "#include <linux/security.h>\n"
              "#include <asm/ptrace.h>\n\n"
              "struct ksu_task_sec {\n"
              "    u32 osid;\n"
              "    u32 sid;\n"
              "    u32 exec_sid;\n"
              "    u32 create_sid;\n"
              "    u32 keycreate_sid;\n"
              "    u32 sockcreate_sid;\n"
              "};\n\n"
              "extern int security_secctx_to_secid(const char *secdata, u32 seclen, u32 *secid);\n"
              "extern bool ksu_is_allow_uid(uid_t uid) __attribute__((weak));\n\n"
              "/* 1. Sucompat Özellik Değişkenleri */\n"
              "bool ksu_su_compat_enabled = true;\n"
              "bool ksu_is_su_compat_enabled(void) { return ksu_su_compat_enabled; }\n"
              "bool ksu_sucompat_is_supported(void) { return true; }\n"
              "bool ksu_is_su_compat_supported(void) { return true; }\n"
              "bool ksu_su_compat_is_supported(void) { return true; }\n"
              "bool su_compat_is_supported(void) { return true; }\n"
              "bool ksu_su_compat_get(void) { return true; }\n"
              "bool ksu_su_compat_get_status(void) { return true; }\n"
              "int ksu_su_compat_set(bool enabled) { ksu_su_compat_enabled = enabled; return 0; }\n"
              "int ksu_su_compat_set_status(bool enabled) { ksu_su_compat_enabled = enabled; return 0; }\n"
              "int ksu_set_su_compat(bool enabled) { ksu_su_compat_enabled = enabled; return 0; }\n"
              "int ksu_set_su_compat_enabled(bool enabled) { ksu_su_compat_enabled = enabled; return 0; }\n"
              "int ksu_sucompat_init(void) { return 0; }\n"
              "void ksu_sucompat_exit(void) {}\n\n"
              "/* 2. Çağıran Sürecin İzin Kontrolü */\n"
              "static inline bool ksu_is_caller_allowed(uid_t uid) {\n"
              "    if (uid == 0 || uid == 2000) return true;\n"
              "    if (ksu_is_allow_uid) return ksu_is_allow_uid(uid);\n"
              "    return false;\n"
              "}\n\n"
              "/* 3. Su Yolu Tespiti */\n"
              "static inline bool ksu_is_su_path(const char __user *user_path) {\n"
              "    char buf[32];\n"
              "    long len;\n"
              "    if (!current->mm || uaccess_kernel() || !user_path) return false;\n"
              "    len = strncpy_from_user(buf, user_path, sizeof(buf));\n"
              "    if (len <= 0) return false;\n"
              "    buf[sizeof(buf) - 1] = '\\0';\n"
              "    return (strcmp(buf, \"/system/bin/su\") == 0 || strcmp(buf, \"/system/xbin/su\") == 0 || strcmp(buf, \"su\") == 0);\n"
              "}\n\n"
              "/* 4. Execveat Kancası: İzinli süreci anında ROOT yap ve /data/adb/ksu/bin/su'ya yönlendir */\n"
              "extern void ksu_handle_execveat_ksud(const char *filename, void *argv);\n"
              "int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) {\n"
              "    if (filename_ptr && *filename_ptr && (*filename_ptr)->name) {\n"
              "        const char *name = (*filename_ptr)->name;\n"
              "        ksu_handle_execveat_ksud(name, argv);\n"
              "        if (current->mm && !uaccess_kernel()) {\n"
              "            if (strcmp(name, \"/system/bin/su\") == 0 || strcmp(name, \"/system/xbin/su\") == 0 || strcmp(name, \"su\") == 0) {\n"
              "                if (ksu_is_caller_allowed(current_uid().val)) {\n"
              "                    struct filename *su_name = getname_kernel(\"/data/adb/ksu/bin/su\");\n"
              "                    if (!IS_ERR(su_name)) {\n"
              "                        struct cred *new_cred = prepare_creds();\n"
              "                        if (new_cred) {\n"
              "                            new_cred->uid.val = 0;\n"
              "                            new_cred->gid.val = 0;\n"
              "                            new_cred->euid.val = 0;\n"
              "                            new_cred->egid.val = 0;\n"
              "                            new_cred->suid.val = 0;\n"
              "                            new_cred->sgid.val = 0;\n"
              "                            new_cred->fsuid.val = 0;\n"
              "                            new_cred->fsgid.val = 0;\n"
              "                            new_cred->cap_effective = CAP_FULL_SET;\n"
              "                            new_cred->cap_permitted = CAP_FULL_SET;\n"
              "                            new_cred->cap_bset = CAP_FULL_SET;\n"
              "                            new_cred->cap_inheritable = CAP_FULL_SET;\n"
              "                            if (new_cred->security) {\n"
              "                                u32 su_sid = 0;\n"
              "                                if (!security_secctx_to_secid(\"u:r:su:s0\", 10, &su_sid)) {\n"
              "                                    struct ksu_task_sec *tsec = new_cred->security;\n"
              "                                    tsec->sid = su_sid;\n"
              "                                    tsec->osid = su_sid;\n"
              "                                }\n"
              "                            }\n"
              "                            commit_creds(new_cred);\n"
              "                        }\n"
              "                        putname(*filename_ptr);\n"
              "                        *filename_ptr = su_name;\n"
              "                    }\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    return 0;\n"
              "}\n\n"
              "/* 5. Stat & Faccessat: İzinli sürece /system/bin/sh simülasyonu sun, izinsiz olana ENOENT ver */\n"
              "int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags) {\n"
              "    if (filename_user && *filename_user && ksu_is_su_path(*filename_user)) {\n"
              "        if (ksu_is_caller_allowed(current_uid().val)) {\n"
              "            struct pt_regs *regs = task_pt_regs(current);\n"
              "            if (regs && regs->sp > 0x1000) {\n"
              "                char __user *fake = (char __user *)(regs->sp - 64);\n"
              "                if (copy_to_user(fake, \"/system/bin/sh\", 15) == 0) {\n"
              "                    *filename_user = fake;\n"
              "                    return 1;\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    return 0;\n"
              "}\n\n"
              "int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags) {\n"
              "    if (filename_user && *filename_user && ksu_is_su_path(*filename_user)) {\n"
              "        if (ksu_is_caller_allowed(current_uid().val)) {\n"
              "            struct pt_regs *regs = task_pt_regs(current);\n"
              "            if (regs && regs->sp > 0x1000) {\n"
              "                char __user *fake = (char __user *)(regs->sp - 64);\n"
              "                if (copy_to_user(fake, \"/system/bin/sh\", 15) == 0) {\n"
              "                    *filename_user = fake;\n"
              "                    return 1;\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    return 0;\n"
              "}\n\n"
              "int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr) { return 0; }\n"
              "int ksu_handle_devpts(struct inode *inode) { return 0; }\n"
          )

          sucomp_done = set()
          for kdir in ["drivers/kernelsu", "KernelSU"]:
              if not os.path.exists(kdir): continue
              for root, dirs, files in os.walk(kdir, followlinks=True):
                  if "sucompat.c" in files:
                      rp = os.path.realpath(os.path.join(root, "sucompat.c"))
                      if rp not in sucomp_done:
                          with open(rp, "w", encoding="utf-8") as f:
                              f.write(full_sucompat_engine)
                          print(f"[OK] 4.14 Native Sucompat Motoru sucompat.c içine yazıldı: {rp}")
                          sucomp_done.add(rp)

          # dispatch.c [ksu_driver] Köprüsü ve Yönetici Kaydı
          bridge_code = (
              "\n/* --- SukiSU Protocol Compliant Command, Prctl & Reboot Supercall Bridge --- */\n"
              "#include <linux/fs.h>\n"
              "#include <linux/file.h>\n"
              "#include <linux/fdtable.h>\n"
              "#include <linux/anon_inodes.h>\n"
              "#include <linux/err.h>\n"
              "#include <linux/uaccess.h>\n"
              "#include <linux/cred.h>\n"
              "#include <linux/capability.h>\n"
              "#include <linux/security.h>\n"
              "#include <linux/sched.h>\n\n"
              "extern unsigned int ksu_manager_appid;\n"
              "extern int security_secctx_to_secid(const char *secdata, u32 seclen, u32 *secid);\n\n"
              "struct ksu_task_sec {\n"
              "    u32 osid;\n"
              "    u32 sid;\n"
              "    u32 exec_sid;\n"
              "    u32 create_sid;\n"
              "    u32 keycreate_sid;\n"
              "    u32 sockcreate_sid;\n"
              "};\n\n"
              "static long ksu_native_sc_ioctl(struct file *filp, unsigned int cmd, unsigned long arg) {\n"
              "    return ksu_supercall_handle_ioctl(filp, cmd, (void __user *)arg);\n"
              "}\n\n"
              "static const struct file_operations ksu_native_sc_fops = {\n"
              "    .owner = THIS_MODULE,\n"
              "    .unlocked_ioctl = ksu_native_sc_ioctl,\n"
              "    .compat_ioctl = ksu_native_sc_ioctl,\n"
              "};\n\n"
              "static int ksu_ensure_driver_fd(void) {\n"
              "    struct files_struct *files = current->files;\n"
              "    struct fdtable *fdt;\n"
              "    struct file *filp;\n"
              "    int i, fd;\n"
              "    if (!files) return -EINVAL;\n"
              "    spin_lock(&files->file_lock);\n"
              "    fdt = files_fdtable(files);\n"
              "    if (fdt && fdt->fd) {\n"
              "        for (i = 0; i < fdt->max_fds; i++) {\n"
              "            struct file *f = fdt->fd[i];\n"
              "            if (f && f->f_path.dentry && f->f_path.dentry->d_name.name) {\n"
              "                if (strcmp(f->f_path.dentry->d_name.name, \"[ksu_driver]\") == 0) {\n"
              "                    spin_unlock(&files->file_lock);\n"
              "                    return i;\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    spin_unlock(&files->file_lock);\n"
              "    fd = get_unused_fd_flags(0);\n"
              "    if (fd < 0) return fd;\n"
              "    filp = anon_inode_getfile(\"[ksu_driver]\", &ksu_native_sc_fops, NULL, O_RDWR);\n"
              "    if (IS_ERR(filp)) {\n"
              "        put_unused_fd(fd);\n"
              "        return PTR_ERR(filp);\n"
              "    }\n"
              "    fd_install(fd, filp);\n"
              "    return fd;\n"
              "}\n\n"
              "int ksu_handle_prctl_bridge(unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5);\n"
              "int ksu_handle_prctl_bridge(unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5) {\n"
              "    uid_t uid = current_uid().val;\n"
              "    int driver_fd;\n"
              "    if (uid >= 10000) {\n"
              "        ksu_manager_appid = uid % 100000;\n"
              "    }\n\n"
              "    /* 1. Sürüm Talebi: KSU_CMD_GET_VERSION (arg2 == 1) */\n"
              "    if (arg2 == 1) {\n"
              "        int ksu_ver = 40940;\n"
              "        int flags = 2; /* 2 = Manual Hook */\n"
              "        if (arg3) {\n"
              "            copy_to_user((void __user *)arg3, &ksu_ver, sizeof(int));\n"
              "        }\n"
              "        if (arg4) {\n"
              "            copy_to_user((void __user *)arg4, &flags, sizeof(int));\n"
              "        }\n"
              "        ksu_ensure_driver_fd();\n"
              "        return 0;\n"
              "    }\n\n"
              "    /* 2. Yetki Talebi: KSU_CMD_GRANT_ROOT (arg2 == 2) */\n"
              "    if (arg2 == 2) {\n"
              "        struct cred *new_cred = prepare_creds();\n"
              "        if (new_cred) {\n"
              "            new_cred->uid.val = 0;\n"
              "            new_cred->gid.val = 0;\n"
              "            new_cred->euid.val = 0;\n"
              "            new_cred->egid.val = 0;\n"
              "            new_cred->suid.val = 0;\n"
              "            new_cred->sgid.val = 0;\n"
              "            new_cred->fsuid.val = 0;\n"
              "            new_cred->fsgid.val = 0;\n"
              "            new_cred->cap_effective = CAP_FULL_SET;\n"
              "            new_cred->cap_permitted = CAP_FULL_SET;\n"
              "            new_cred->cap_bset = CAP_FULL_SET;\n"
              "            new_cred->cap_inheritable = CAP_FULL_SET;\n"
              "            if (new_cred->security) {\n"
              "                u32 su_sid = 0;\n"
              "                if (!security_secctx_to_secid(\"u:r:su:s0\", 10, &su_sid)) {\n"
              "                    struct ksu_task_sec *tsec = new_cred->security;\n"
              "                    tsec->sid = su_sid;\n"
              "                    tsec->osid = su_sid;\n"
              "                }\n"
              "            }\n"
              "            commit_creds(new_cred);\n"
              "        }\n"
              "        ksu_ensure_driver_fd();\n"
              "        return 0;\n"
              "    }\n\n"
              "    /* 3. Genel [ksu_driver] Talebi */\n"
              "    driver_fd = ksu_ensure_driver_fd();\n"
              "    if (arg3 > 0x10000) {\n"
              "        copy_to_user((void __user *)arg3, &driver_fd, sizeof(driver_fd));\n"
              "        return 0;\n"
              "    }\n"
              "    if (arg2 > 0x10000) {\n"
              "        copy_to_user((void __user *)arg2, &driver_fd, sizeof(driver_fd));\n"
              "        return 0;\n"
              "    }\n"
              "    return driver_fd;\n"
              "}\n\n"
              "int ksu_handle_reboot_bridge(int magic1, int magic2, unsigned int cmd, void __user *arg);\n"
              "int ksu_handle_reboot_bridge(int magic1, int magic2, unsigned int cmd, void __user *arg) {\n"
              "    if ((unsigned int)magic1 == 0xdeadbeef && (unsigned int)magic2 == 0xcafebabe) {\n"
              "        uid_t uid = current_uid().val;\n"
              "        if (uid >= 10000) {\n"
              "            ksu_manager_appid = uid % 100000;\n"
              "        }\n"
              "        int driver_fd = ksu_ensure_driver_fd();\n"
              "        if (arg && (unsigned long)arg > 0x1000) {\n"
              "            copy_to_user(arg, &driver_fd, sizeof(driver_fd));\n"
              "        }\n"
              "        return driver_fd;\n"
              "    }\n"
              "    return -EINVAL;\n"
              "}\n"
          )
          disp_done = set()
          for kdir in ["drivers/kernelsu", "KernelSU"]:
              if not os.path.exists(kdir): continue
              for root, dirs, files in os.walk(kdir, followlinks=True):
                  if "dispatch.c" in files:
                      rp = os.path.realpath(os.path.join(root, "dispatch.c"))
                      if rp not in disp_done:
                          with open(rp, "r") as f: dc = f.read()
                          if "ksu_handle_prctl_bridge" not in dc:
                              with open(rp, "a") as f: f.write(bridge_code)
                              print(f"[OK] Standart Prctl & Reboot Köprüsü dispatch.c içine eklendi: {rp}")
                          disp_done.add(rp)

          # 1. kernel/sys.c içine prctl kancası
          sys_c = "kernel/sys.c"
          if os.path.exists(sys_c):
              with open(sys_c, "r") as f: syc = f.read()
              if "ksu_handle_prctl_bridge" not in syc:
                  prctl_hook = (
                      "\n#if defined(CONFIG_KSU)\n"
                      "    /* [ksu_handle_prctl_bridge] */\n"
                      "    if (option == 0xdeadbeef) {\n"
                      "        extern int ksu_handle_prctl_bridge(unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5);\n"
                      "        return ksu_handle_prctl_bridge(arg2, arg3, arg4, arg5);\n"
                      "    }\n"
                      "#endif\n"
                  )
                  p = syc.find("SYSCALL_DEFINE5(prctl")
                  if p != -1:
                      b = syc.find("{", p)
                      if b != -1:
                          syc = syc[:b+1] + prctl_hook + syc[b+1:]
                          with open(sys_c, "w") as f: f.write(syc)
                          print("[OK] kernel/sys.c içine prctl kancası yerleştirildi!")

          # 2. kernel/reboot.c VE kernel/sys.c içine reboot kancası
          reboot_hook = (
              "\n#if defined(CONFIG_KSU)\n"
              "    /* [ksu_handle_reboot_bridge] */\n"
              "    if ((unsigned int)magic1 == 0xdeadbeef && (unsigned int)magic2 == 0xcafebabe) {\n"
              "        extern int ksu_handle_reboot_bridge(int magic1, int magic2, unsigned int cmd, void __user *arg);\n"
              "        return ksu_handle_reboot_bridge(magic1, magic2, cmd, arg);\n"
              "    }\n"
              "#endif\n"
          )
          for rfile in ["kernel/reboot.c", "kernel/sys.c"]:
              if os.path.exists(rfile):
                  with open(rfile, "r") as f: rcontent = f.read()
                  if "ksu_handle_reboot_bridge" not in rcontent:
                      m = re.search(r'SYSCALL_DEFINE4\s*\(\s*reboot\b', rcontent)
                      if m:
                          b = rcontent.find("{", m.end())
                          if b != -1:
                              rcontent = rcontent[:b+1] + reboot_hook + rcontent[b+1:]
                              with open(rfile, "w") as f: f.write(rcontent)
                              print(f"[OK] {rfile} içine reboot(0xdeadbeef, 0xcafebabe) kancası yerleştirildi!")

      - name: Setup Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          DEFCONFIG_FILE="arch/arm64/configs/${DEVICE}_defconfig"

          {
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_SUCOMPAT=y"
            echo "CONFIG_KPM=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          } >> "$DEFCONFIG_FILE"

          make ARCH=arm64 O=out "${DEVICE}_defconfig"

          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --disable CONFIG_CC_WERROR
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUCOMPAT

          make ARCH=arm64 O=out olddefconfig

          grep -E "^CONFIG_KSU=y" out/.config || (echo "HATA: CONFIG_KSU defconfig tarafından silindi!" && exit 1)

      - name: Build Raw Kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-typedef-redefinition -Wno-declaration-after-statement" \
            Image

          if strings out/arch/arm64/boot/Image | grep -q "ksu_sys_fstat"; then
            echo "HATA: ksu_sys_fstat hala kernel içinde mevcut!"
            exit 1
          else
            echo "[OK] Doğrulama başarılı: Dinamik kancalar temizlendi."
          fi

      - name: Patch SukiSU Ultra KPM
        shell: bash
        run: |
          set -euo pipefail
          OUT_BOOT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot"
          if [[ "${{ env.KPM_SUPPORT }}" == "true" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"
            cd "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"

            wget -nv -O patch_linux "${{ env.KPM_URL }}" || wget -nv "${{ env.KPM_URL }}"
            chmod +x patch_linux
            cp "$OUT_BOOT/Image" .

            ./patch_linux

            if [[ -f oImage ]]; then
              echo "KPM injection successful!"
              gzip -c oImage > "$OUT_BOOT/Image.gz"
            else
              echo "Error: patch_linux oImage üretemedi!"
              exit 1
            fi
          else
            gzip -c "$OUT_BOOT/Image" > "$OUT_BOOT/Image.gz"
          fi

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone "${{ env.ANYKERNEL3_SOURCE }}" -b "${{ env.ANYKERNEL3_BRANCH }}" --depth=1 AnyKernel3

          sed -i -E 's|^[# ]*do\.devicecheck=.*|do.devicecheck=0|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*block=.*|block=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*BLOCK=.*|BLOCK=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*is_slot_device=.*|is_slot_device=0;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|g' AnyKernel3/anykernel.sh

          cp android-kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: Upload SukiSU AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Lancelot-LOS20-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
